<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadenza Script Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input[type="file"] {
            margin-bottom: 15px;
            color: #94a3b8;
            width: 100%;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        .btn:hover { background: #0ea5e9; }
        #result {
            margin-top: 15px;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cadenza Script Converter</h1>
        <p>Upload Asset Bundle (.zip or .unity3d) to convert for iOS</p>
        
        <input type="file" id="fileInput"><br>
        <button class="btn" onclick="uploadFile()">Convert Now</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert('សូមជ្រើសរើសឯកសារជាមុនសិន!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultDiv.innerText = 'កំពុងដំណើរការ (Processing)...';

            try {
                const response = await fetch('https://cadenza-backend-api.onrender.com/convert', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerText = ' thành công: ' + data.message;
                } else {
                    resultDiv.innerText = 'Error: ' + data.error;
                }
            } catch (error) {
                resultDiv.innerText = 'Connection Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
