workflows:
  cadenza-ios-workflow:
    name: Cadenza iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App Archive
        script: |
          # ប្រសិនបើអ្នកមាន Xcode Project ស្រាប់ វានឹងทำการ Build ទីនេះ
          xcodebuild -version
    artifacts:
      - build/ios/ipa/*.ipa
