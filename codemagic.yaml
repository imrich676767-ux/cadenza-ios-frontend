workflows:
  cadenza-ios-workflow:
    name: Cadenza iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          # សម្រាប់ Test build ចេញជា ipa ពេលអត់ទាន់มี Xcode project ពេញលេញ
          mkdir -p build/ios/ipa
          echo "Mock Cadenza App Build" > build/ios/ipa/Cadenza.ipa
    artifacts:
      - build/ios/ipa/*.ipa
